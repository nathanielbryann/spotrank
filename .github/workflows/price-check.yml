name: Check one day's prices

on:
  push:
    branches: [main]
    paths: [".github/price-check.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Compare ENTSO-E with Elering
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/price_check.py
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/price_check.md || true
          git commit -m "Price check $(date -u +%FT%H%MZ)" || exit 0
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 10; done
