name: Backfill generation data

# Fills in the history of generation by technology for the merit-order chart.
# Runs when .github/backfill-request.txt changes (or with "Run workflow").
# The request file can hold two lines:  zones: DE-LU,FR   minutes: 80
on:
  push:
    branches: [main]
    paths: [".github/backfill-request.txt"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to spend"
        default: "80"

permissions:
  contents: write
  pages: write              # redeploy the site with the new data
  id-token: write

concurrency:
  group: spotrank-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Fetch generation by technology and installed capacity
        continue-on-error: true
        timeout-minutes: 100
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          REQ=.github/backfill-request.txt
          MINUTES="${{ github.event.inputs.minutes }}"
          ZONES=""
          if [ -f "$REQ" ]; then
            [ -z "$MINUTES" ] && MINUTES=$(sed -n 's/^minutes: *//p' "$REQ" | head -1)
            ZONES=$(sed -n 's/^zones: *//p' "$REQ" | head -1)
          fi
          MINUTES=${MINUTES:-80}
          EXTRA=""
          [ -n "$ZONES" ] && EXTRA="--zones $ZONES"
          echo "Backfilling for $MINUTES minutes ${ZONES:+(zones $ZONES)}"
          python scripts/build_spotrank_data.py --skip-prices --end today --workers 24 $EXTRA \
            --gen-out site/data/gen --gen-budget $((MINUTES * 60))
      - name: Save the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/gen
          git commit -m "Generation data backfill $(date -u +%FT%H%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 15; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
