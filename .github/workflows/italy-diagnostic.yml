name: Check Italian zones on ENTSO-E

on:
  push:
    branches: [main]
    paths: ["scripts/italy_diagnostic.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Ask ENTSO-E
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/italy_diagnostic.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/italy_availability.md
          git commit -m "Italian zones availability check" || exit 0
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 10; done
