name: Check the leaderboard database

# Calls the Supabase functions once and saves the answers in diagnostics/,
# to confirm that supabase/setup.sql ran. Starts when .github/supabase-check.txt changes.
on:
  push:
    branches: [main]
    paths: [".github/supabase-check.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Call the functions
        env:
          SB_URL: https://ywzvupcjyuvftnpchrtr.supabase.co
          SB_KEY: sb_publishable_uRr_kiMcy3RxNQk2_52AIg_h5QsoYLF
        run: |
          call() { echo "== $1 $2"; curl -sS -m 30 -X POST "$SB_URL/rest/v1/rpc/$1" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d "$2" -w "\nHTTP %{http_code}\n"; }
          {
            date -u
            call ping '{}'
            for n in 1 2 3; do call day_results "{\"p_puzzle\": $n}"; done
            call my_results '{"p_secret": "00000000-0000-0000-0000-000000000000"}'
            call my_progress '{"p_secret": "00000000-0000-0000-0000-000000000000"}'
            call save_attempt '{"p_secret": "00000000-0000-0000-0000-000000000000", "p_puzzle": 1, "p_price_date": "2026-11-15", "p_answer": ["A","B","C","D","E"], "p_attempts": [["A","B","C","D","E"]]}'
            call leaderboard '{"p_from": "2026-11-01", "p_to": "2026-12-31"}'
            echo "== direct table read (must be refused)"
            curl -sS -m 30 "$SB_URL/rest/v1/players?select=*" -H "apikey: $SB_KEY" -w "\nHTTP %{http_code}\n"
            echo; echo "#### Forecast challenge (supabase/forecast-challenge.sql)"
            call fc_day_results '{"p_delivery": "2026-11-17"}'
            call fc_leaderboard '{"p_from": "2026-11-01", "p_to": "2026-12-31"}'
            call my_forecasts '{"p_secret": "00000000-0000-0000-0000-000000000000"}'
            call submit_forecast '{"p_secret": "00000000-0000-0000-0000-000000000000", "p_delivery": "2026-11-17", "p_ranking": ["FI","SE3","FR","DE-LU","PL"]}'
            for t in forecasts forecast_days day_prices; do
              echo "== direct read of $t with the page's key (must be refused)"
              curl -sS -m 30 "$SB_URL/rest/v1/$t?select=*&limit=1" -H "apikey: $SB_KEY" -w "\nHTTP %{http_code}\n"
            done
          } > diagnostics/supabase_check.txt 2>&1
          cat diagnostics/supabase_check.txt
      - name: Send prices with the secret key and read them back
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          {
            echo; echo "#### Prices for scoring (SUPABASE_SECRET_KEY)"
            if [ -z "$SUPABASE_SECRET_KEY" ]; then echo "The SUPABASE_SECRET_KEY secret is not set."; exit 0; fi
            echo "Secret is set (starts with ${SUPABASE_SECRET_KEY:0:10}...)"
            python3 scripts/push_day_prices.py --days 10
            echo "== day_prices read back with the secret key (dates and number of zones only)"
            curl -sS -m 30 "https://ywzvupcjyuvftnpchrtr.supabase.co/rest/v1/day_prices?select=price_date,updated_at&order=price_date.desc&limit=12" \
              -H "apikey: $SUPABASE_SECRET_KEY" -w "\nHTTP %{http_code}\n"
          } >> diagnostics/supabase_check.txt 2>&1
          tail -20 diagnostics/supabase_check.txt
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/supabase_check.txt
          git commit -m "Leaderboard database check $(date -u +%FT%H%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
