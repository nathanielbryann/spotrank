name: New zones check

# One-off check of the sources for Ireland, Great Britain and the ECB rate (map-only zones).
on:
  push:
    branches: [main]
    paths: [".github/new-zones-check.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Check the sources
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/new_zones_check.py
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/new_zones_check.md || true
          git commit -m "New zones check $(date -u +%FT%H%MZ)" || exit 0
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 10; done
