name: Update prices and deploy

on:
  # the daily start comes from daily-start.yml (GitHub didn't run a schedule kept in this file)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "full: prices and everything else (afternoon). clues: only tomorrow's forecasts and weather for the Forecast challenge, never prices (morning)"
        default: "full"
        type: choice
        options: [full, clues]
      drivers_minutes:
        description: "Minutes to spend on wind/solar/load data (the first backfill needs about 80)"
        default: "15"
      gen_minutes:
        description: "Minutes to spend on generation by technology (merit-order chart)"
        default: "10"
  push:
    branches: [main]        # redeploy when you change the site

permissions:
  contents: write           # commit the updated price file
  pages: write              # deploy to GitHub Pages
  id-token: write

concurrency:
  group: spotrank
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always build from the latest main, including data commits made by earlier runs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Fetch latest ENTSO-E prices
        if: github.event_name != 'push' && inputs.mode != 'clues'   # code pushes only redeploy; prices are fetched on schedule or "Run workflow"
        timeout-minutes: 12
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then
            echo "::warning::The ENTSOE_API_KEY secret is not set, so the existing prices are deployed unchanged."
            exit 0
          fi
          python scripts/build_spotrank_data.py --update --end tomorrow --no-csv --time-budget 540 --out site/data/spotrank_data.json

      - name: Fetch wind, solar and load forecasts
        if: github.event_name != 'push' && inputs.mode != 'clues'
        continue-on-error: true   # a slow ENTSO-E day never blocks the price update
        timeout-minutes: 100
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MINUTES: ${{ github.event.inputs.drivers_minutes || '15' }}
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then exit 0; fi
          python scripts/build_spotrank_data.py --skip-prices --end tomorrow --workers 16 \
            --drivers-out site/data/spotrank_drivers.json --drivers-budget $((MINUTES * 60))

      - name: Fetch generation by technology and installed capacity
        if: github.event_name != 'push' && inputs.mode != 'clues'
        continue-on-error: true   # never blocks the price update
        timeout-minutes: 100
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MINUTES: ${{ github.event.inputs.gen_minutes || '10' }}
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then exit 0; fi
          python scripts/build_spotrank_data.py --skip-prices --end today --workers 16 \
            --gen-out site/data/gen --gen-budget $((MINUTES * 60))

      - name: Fetch the other Italian zones and Italy as a whole (Market data only)
        if: github.event_name != 'push' && inputs.mode != 'clues'
        continue-on-error: true
        timeout-minutes: 30
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then exit 0; fi
          python scripts/build_spotrank_data.py --update --no-csv --zones extra --end tomorrow --workers 6 \
            --time-budget 300 --out site/data/spotrank_data_extra.json || true
          python scripts/build_spotrank_data.py --skip-prices --zones extra --end tomorrow --workers 8 \
            --drivers-out site/data/spotrank_drivers_extra.json --drivers-budget 300 || true
          python scripts/build_spotrank_data.py --skip-prices --zones extra --end today --workers 8 \
            --gen-out site/data/gen --gen-budget 300 || true

      - name: Clues for the Forecast challenge (tomorrow's forecasts and weather; never prices)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 8
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          # the afternoon run already fetched tomorrow's ENTSO-E forecasts; the morning runs refresh them
          if [ "$MODE" = "clues" ]; then python scripts/build_clues.py --entsoe --weather; else python scripts/build_clues.py --weather; fi

      - name: Keep the leaderboard database awake
        # Supabase pauses free projects after a week without activity; one small call a day prevents that
        continue-on-error: true
        run: |
          curl -sS -m 30 -X POST "https://ywzvupcjyuvftnpchrtr.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_uRr_kiMcy3RxNQk2_52AIg_h5QsoYLF" -H "Content-Type: application/json" -d '{}' || true

      - name: Send prices to the leaderboard database (scores the Forecast challenge)
        # needs the SUPABASE_SECRET_KEY secret; without it this step only prints a notice
        if: inputs.mode != 'clues'
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/push_day_prices.py --days 10

      - name: Commit updated prices
        run: |
          if [ -z "$(git status --porcelain site/data)" ]; then
            echo "No new prices."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "$([ '${{ inputs.mode }}' = clues ] && echo 'Clues updated' || echo 'Data updated') $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
